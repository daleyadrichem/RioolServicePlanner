[build-system]
requires = ["uv-build>=0.2"]
build-backend = "uv_build"

[project]
name = "riool_service"
version = "0.1.0"
description = "Some description"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "geopy",
    "sqlalchemy",
    "python-dotenv",
    "pydantic",
    "uvicorn",
    "fastapi"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy"
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "geopy.*",
]
ignore_missing_imports = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package.find]
where = ["src"]